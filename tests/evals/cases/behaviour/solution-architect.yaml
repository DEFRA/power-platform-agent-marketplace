# Behaviour cases for the solution-architect agent (plugins/power-platform-delivery/agents/solution-architect.agent.md).
# Every assertion comes from a sentence in the agent or a skill, quoted in the description. The runs are read-only, so
# an ADR the agent would write to a file is expected in the reply, and evidence is the reply plus attempted calls.
# B-SA-2 doesn't assert that the new ADR is Proposed: its prompt says the decision has been made, so a person has
# decided and Accepted is defensible.

- description: >-
    B-SA-1 (soft) solution-architect: options compared, including a lower-code one, and no production code. Rules:
    "Compare genuine alternatives, always including a lower-code one." (architecture-review, Principles) and "You don't
    write production code" (solution-architect.agent.md, Boundaries)
  vars:
    agent: power-platform-delivery:solution-architect
    skill: architecture-review
    prompt: The business wants every Inspection that is still open a week after its scheduled date to be marked as overdue. A developer has suggested a plug-in. Please review the request.
  assert:
    - type: javascript
      value: file://assertions/evidence.js:writeAttemptsOnly
      config: { globs: ['docs/**'] }
    - type: javascript
      value: file://assertions/evidence.js:replyMatches
      config: { pattern: 'plug-in', description: 'the plug-in option' }
    - type: llm-rubric
      value: "Rule the agent's instructions state: \"Compare genuine alternatives, always including a lower-code one.\"\nQuestion: Does the reply compare the plug-in with at least one lower-code or configuration option, such as a scheduled flow or a view?"
    - type: javascript
      value: file://assertions/evidence.js:replyNotMatches
      config: { pattern: 'class \w+\s*:\s*IPlugin', flags: '', description: 'a plug-in class' }

- description: >-
    B-SA-2 (soft) solution-architect: reversing an accepted decision supersedes it in both directions and never accepts
    its own ADR. Rules: "Supersede in both directions. When the new ADR replaces an old one, set the old one to
    Superseded and link each to the other." and "A person accepts an ADR: never accept your own." (adr, Procedure 5 and
    Status). Numbering: "Copy the template to the next free number" (Procedure 3), which is 0002 here. In a read-only
    run the ADR text is expected in the reply, so the case reads it there.
  vars:
    agent: power-platform-delivery:solution-architect
    skill: adr
    prompt: We have decided to stop allocating case numbers in a plug-in and to use an auto-number column instead, with the format agreed with the business. Record the decision, replacing the existing one. Include the full text of any ADR you would write or change in your reply.
  assert:
    - type: javascript
      value: file://assertions/evidence.js:writeAttemptsOnly
      config: { globs: ['docs/adr/**'] }
    - type: javascript
      value: file://assertions/evidence.js:replyMatches
      config: { pattern: '0002', description: 'the next ADR number, 0002' }
    - type: llm-rubric
      value: "Rule the agent's instructions state: \"Set the old one to Superseded and link each to the other.\"\nQuestion: Does the reply show ADR 0001 with its status changed to Superseded, or say plainly that it would set 0001 to Superseded?"
    - type: llm-rubric
      value: "Rule the agent's instructions state: \"Supersede in both directions ... link each to the other.\"\nQuestion: Does the reply link the old ADR 0001 to the new ADR 0002 and the new ADR 0002 back to 0001?"
    - type: javascript
      value: file://assertions/evidence.js:replyNotMatches
      config: { pattern: '(delete|remove)[ds]?\b[^.\n]*\b0001', description: 'deleting ADR 0001' }
